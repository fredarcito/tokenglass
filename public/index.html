    <div class="field">
      <label for="toDate" data-i18n="filters.to"></label>
      <input type="date" id="toDate">
    </div>
    <div class="field">
      <label for="projectSel" data-i18n="filters.project"></label>
      <select id="projectSel"></select>
    </div>
    <div class="presets" id="presetBox"></div>
    <div class="field">
      <span class="lbl" data-i18n="filters.measure"></span>
      <div class="seg" id="measureSeg" role="group"></div>
    </div>
  </div>
  <p class="hint" id="measureHint" data-i18n="measure.hint" hidden></p>
  <p class="hint" id="weightHint" hidden></p>

          <p class="card-sub" data-i18n="daily.intro"></p>
          <div id="dailyBody"></div>
        </div>
        <div class="card">
          <h2 data-i18n="models.title"></h2>
          <p class="card-sub" id="modelsSub"></p>
          <div id="modelsBody"></div>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="trend.title"></h2>
        <p class="card-sub" data-i18n="trend.intro"></p>
        <div id="trendBody"></div>
      </div>

        <h2 data-i18n="mistakes.title"></h2>

        <h2 data-i18n="mistakes.title"></h2>
        <p class="card-sub" data-i18n="mistakes.intro"></p>
        <div id="mistakesDiag"></div>

      <div id="sessionBody" class="view"></div>
    </section>
  </div>
</main>

    else el.setAttribute(key, value);
  });
  kids.flat().forEach((kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  });
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function storeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }
function localDay(ms) {
  const d = new Date(ms);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseDay(day) {
  const p = day.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2], 12);
}
function addDays(day, n) {
  const d = parseDay(day);
  d.setDate(d.getDate() + n);
  return localDay(d.getTime());
}

/* =====================================================================
   Translations and number/date formatting
   ===================================================================== */
const PLURAL_RE = /\{(\w+),\s*plural,\s*((?:(?:zero|one|two|few|many|other)\s*\{[^{}]*\}\s*)+)\}/g;

function numberText(n) {
  const digits = Math.floor(n) === n ? 0 : 1;
  return new Intl.NumberFormat(S.lang, { maximumFractionDigits: digits }).format(n);
}

function format(template, params) {
  const p = params || {};
  const withPlurals = String(template).replace(PLURAL_RE, (match, name, body) => {
    const n = Number(p[name]);
    let rule = 'other';
    try { rule = isFinite(n) ? new Intl.PluralRules(S.lang).select(n) : 'other'; } catch (e) { rule = 'other'; }
    const options = {};
    body.replace(/(\w+)\s*\{([^{}]*)\}/g, (m, key, text) => { options[key] = text; return ''; });
    const chosen = options[rule] !== undefined ? options[rule] : options.other;
    return String(chosen === undefined ? '' : chosen).replace(/#/g, isFinite(n) ? numberText(n) : '');
  });
  return withPlurals.replace(/\{(\w+)\}/g, (match, name) => {
    if (!Object.prototype.hasOwnProperty.call(p, name)) return match;
    const v = p[name];
    if (typeof v === 'number' && isFinite(v)) return numberText(v);
    return v === null || v === undefined ? '' : String(v);
  });
}

function t(key, params) {
  const table = S.tables[S.lang] || {};
  let template = table[key];
  if (template === undefined) template = (S.tables.en || {})[key];
  if (template === undefined) return key;
  return format(template, params);
}

let F = {};
function setFormatters() {
  const lang = S.lang;
  const unit = (u) => new Intl.NumberFormat(lang, { style: 'unit', unit: u, unitDisplay: 'narrow', maximumFractionDigits: 0 });
  F = {
    int: new Intl.NumberFormat(lang, { maximumFractionDigits: 0 }),
    compact: new Intl.NumberFormat(lang, { notation: 'compact', maximumFractionDigits: 1 }),
    pct: new Intl.NumberFormat(lang, { style: 'percent', maximumFractionDigits: 1 }),
    date: new Intl.DateTimeFormat(lang, { dateStyle: 'medium' }),
    dateTime: new Intl.DateTimeFormat(lang, { dateStyle: 'medium', timeStyle: 'short' }),
    short: new Intl.DateTimeFormat(lang, { month: 'short', day: 'numeric' }),
    hour: unit('hour'),
    minute: unit('minute'),
    second: unit('second')
  };
}

function fmtInt(n) { return F.int.format(Math.round(n)); }
function fmtCompact(n) { return F.compact.format(n); }
function fmtPct(fraction) { return F.pct.format(fraction); }
function fmtDuration(ms) {
  if (!Number.isFinite(ms)) return '—';
  if (ms < 60000) return F.second.format(Math.round(ms / 1000));
  const total = Math.round(ms / 60000);
  const hours = Math.floor(total / 60);
  const minutes = total % 60;
  if (!hours) return F.minute.format(minutes);
  return F.hour.format(hours) + (minutes ? ' ' + F.minute.format(minutes) : '');
}
function fmtSpan(ms) {
  if (!Number.isFinite(ms)) return '—';
  const days = Math.floor(ms / 86400000);
  return days > 0 ? t('duration.days', { days }) : fmtDuration(ms);
}
function hasActiveDuration(session) {
  return Number.isFinite(session.activeDurationMs);
}
function hasSessionSpan(session) {
  return Number.isFinite(session.durationMs);
}
function sessionDurationValue(session) {
  return fmtDuration(hasActiveDuration(session) ? session.activeDurationMs : session.durationMs);
}
function median(values) {
  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) return null;
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

/** Apply translations to every element marked with data-i18n / data-i18n-attr. */
function applyI18n() {
  document.documentElement.lang = S.lang;
  document.title = t('app.title');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
    el.getAttribute('data-i18n-attr').split(';').forEach((pair) => {
      const parts = pair.split(':');
      if (parts.length === 2) el.setAttribute(parts[0], t(parts[1]));
    });
  });
}

function resolvedTheme() {
  if (S.themeMode === 'light' || S.themeMode === 'dark') return S.themeMode;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* =====================================================================
   Loading
   ===================================================================== */
function initialLang() {
  const stored = storeGet('lang');
  if (SUPPORTED.indexOf(stored) !== -1) return stored;
  const configured = metaTag('default-lang');
  if (SUPPORTED.indexOf(configured) !== -1) return configured;
  const browser = String(navigator.language || 'en').toLowerCase().slice(0, 2);
  return SUPPORTED.indexOf(browser) !== -1 ? browser : 'en';
}

function readToken() {
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (fromUrl) {
    try { sessionStorage.setItem('token', fromUrl); } catch (e) { /* ignore */ }
    return fromUrl;
  }
  try { return sessionStorage.getItem('token'); } catch (e) { return null; }
}

async function loadTranslations() {
  await Promise.all(SUPPORTED.map(async (code) => {
    const res = await fetch('/i18n/' + code + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('i18n');
    S.tables[code] = await res.json();
  }));
}

async function loadData() {
  if (!S.token) throw { code: 'noToken' };
  const res = await fetch('/api/data', { cache: 'no-store', headers: { 'x-dashboard-token': S.token } });
  if (res.status === 401) throw { code: 'noToken' };
  if (!res.ok) throw { code: 'load' };
  S.data = await res.json();
}

/* =====================================================================
   Filtering and aggregation
   ===================================================================== */
function weigh(agg) {
  const w = S.data.meta.weights;
  return agg.i * w.input + agg.o * w.output + agg.cw * w.cacheWrite + agg.cr * w.cacheRead;
}

/** Value of one token type under the selected measure (raw tokens or weighted). */
function typeValue(type, agg) {
  const raw = agg[FIELD[type]];
  return S.filters.measure === 'weighted' ? raw * S.data.meta.weights[type] : raw;
}

function aggValue(agg) {
  return TYPES.reduce((acc, type) => acc + typeValue(type, agg), 0);
}

function emptyAgg() { return { i: 0, o: 0, cw: 0, cr: 0, n: 0, sn: 0, s: 0 }; }
function addInto(target, row) {
  target.i += row.i; target.o += row.o; target.cw += row.cw; target.cr += row.cr;
  target.n += row.n || 0; target.sn += row.sn || 0; target.s += row.s || 0;
}

function computeView() {
  const { from, to, project } = S.filters;
  const inDay = (d) => d === null || ((!from || d >= from) && (!to || d <= to));
  const diags = S.data.diagnostics.filter((d) => (project === 'all' || d.project === project) && inDay(localDay(d.ts)));
  const issuesBySession = new Map();
  diags.forEach((d) => {
    if (d.severity === 'warn') issuesBySession.set(d.sessionId, (issuesBySession.get(d.sessionId) || 0) + 1);
  });

  const sessions = [];
  const days = new Map();
  const models = new Map();
  const totals = emptyAgg();

  S.data.sessions.forEach((s) => {
    if (project !== 'all' && s.project !== project) return;
    const agg = emptyAgg();
    s.rows.forEach((r) => {
      if (!inDay(r.d)) return;
      addInto(agg, r);
      addInto(totals, r);
      if (r.d !== null) {
        if (!days.has(r.d)) days.set(r.d, emptyAgg());
        addInto(days.get(r.d), r);
      }
      if (!models.has(r.m)) models.set(r.m, emptyAgg());
      addInto(models.get(r.m), r);
    });
    if (agg.n === 0) return;
    sessions.push({
      s: s,
      agg: agg,
      raw: agg.i + agg.o + agg.cw + agg.cr,
      weighted: weigh(agg),
      issues: issuesBySession.get(s.id) || 0
    });
  });

  return { sessions, diags, days, models, totals, raw: totals.i + totals.o + totals.cw + totals.cr, weighted: weigh(totals) };
}

function dataRange() {
  let min = '';
  let max = '';
  S.data.sessions.forEach((s) => s.rows.forEach((r) => {
    if (r.d === null) return;
    if (!min || r.d < min) min = r.d;
    if (!max || r.d > max) max = r.d;
  }));
  return { min, max };
}

/** Every calendar day between the first and last day with data (so gaps show as empty bars). */
function dayLabels(v) {
  const keys = Array.from(v.days.keys()).sort();
  if (keys.length === 0) return [];
  const span = (parseDay(keys[keys.length - 1]) - parseDay(keys[0])) / 86400000;
  if (span > 400) return keys;
  const labels = [];
  for (let d = keys[0]; d <= keys[keys.length - 1]; d = addDays(d, 1)) labels.push(d);
  return labels;
}

function renderNotices() {

  const add = (cls, text) => box.appendChild(h('div', { class: 'banner ' + cls, role: 'status', text: text }));

  add('quiet', t('quality.note', {
    malformed: info.lineQuality.malformed,

    duplicates: info.lineQuality.duplicateAssistantLines,

  }));

function renderToolbar() {
  const range = dataRange();
  const from = $('#fromDate');
  const to = $('#toDate');
  from.min = to.min = range.min;
  from.max = to.max = range.max;
  from.value = S.filters.from;
  to.value = S.filters.to;

  const presets = $('#presetBox');
  clear(presets);
  [['7', 'filters.range7'], ['30', 'filters.range30'], ['all', 'filters.rangeAll']].forEach((p) => {
    presets.appendChild(h('button', { type: 'button', class: 'pbtn', 'aria-pressed': String(S.preset === p[0]), text: t(p[1]), onclick: () => applyPreset(p[0]) }));
  });

  const select = $('#projectSel');
  clear(select);
  const projects = new Map();
  S.data.sessions.forEach((s) => { if (!projects.has(s.project)) projects.set(s.project, s.projectName); });
  const names = Array.from(projects.values());
  select.appendChild(h('option', { value: 'all', text: t('filters.allProjects') }));
  Array.from(projects.entries())
    .sort((a, b) => a[1].localeCompare(b[1], S.lang))
    .forEach((entry) => {
      const duplicated = names.filter((n) => n === entry[1]).length > 1;
      select.appendChild(h('option', { value: entry[0], text: duplicated ? entry[0] : entry[1] }));
    });
  if (!projects.has(S.filters.project)) S.filters.project = 'all';
  select.value = S.filters.project;

  const measure = $('#measureSeg');
  clear(measure);
  [['tokens', 'measure.tokens'], ['weighted', 'measure.weighted']].forEach((m) => {
    measure.appendChild(h('button', { type: 'button', 'aria-pressed': String(S.filters.measure === m[0]), text: t(m[1]), onclick: () => { S.filters.measure = m[0]; renderAll(); } }));
  });
  const weights = S.data.meta.weights;
  $('#weightHint').textContent = t('measure.weights', {
    input: weights.input, cacheWrite: weights.cacheWrite, cacheRead: weights.cacheRead, output: weights.output
  });
  $('#weightHint').hidden = S.filters.measure !== 'weighted';
}

function applyPreset(preset) {
  S.preset = preset;
  if (preset === 'all') {
    S.filters.from = '';
    S.filters.to = '';
  } else {
    const days = parseInt(preset, 10);
    const today = localDay(Date.now());
    S.filters.from = addDays(today, -(days - 1));
    S.filters.to = today;
  }
  S.sessionLimit = 15;
  S.diagLimit = 10;
  renderAll();
}

function expensiveRegex() {

function renderModels(v) {
  const box = $('#modelsBody');

  clear(sub);

  }

  const rows = Array.from(v.models.entries())
    .map((e) => ({ model: e[0], value: aggValue(e[1]), turns: e[1].n }))
    .sort((a, b) => b.value - a.value);
  const top = rows.slice(0, 5);
  const rest = rows.slice(5);
  if (rest.length) top.push({ model: null, value: rest.reduce((a, r) => a + r.value, 0), turns: rest.reduce((a, r) => a + r.turns, 0) });
  const sum = rows.reduce((a, r) => a + r.value, 0) || 1;

    body.appendChild(h('tr', {},
      h('td', {}, h('span', { class: 'mname' }, h('span', { class: 'sw m' + (i + 1) }), nameOf(r))),

    h('thead', {}, h('tr', {},
      h('th', { scope: 'col', text: t('models.col.model') }),

      h('th', { scope: 'col', text: t('models.col.tokens') }),

/* =====================================================================
   Sessions table
   ===================================================================== */
function sortValue(item, key) {
  switch (key) {
    case 'project': return item.s.projectName.toLowerCase();
    case 'task': return (item.s.title || '').toLocaleLowerCase(S.lang);
    case 'date': return Number.isFinite(item.s.start) ? item.s.start : 0;
    case 'duration': return hasActiveDuration(item.s) ? item.s.activeDurationMs : item.s.durationMs;
    case 'turns': return item.s.turns;
    case 'context': return item.s.maxContext;
    case 'tokens': return item.raw;
    case 'issues': return item.issues;
    default: return item.weighted;
  }
}

function renderSessions(v) {
  const box = $('#sessionsBody');
  clear(box);
  const query = S.sessionSearch.trim().toLocaleLowerCase(S.lang);
  const visibleSessions = v.sessions.filter((item) => !query || (item.s.title || '').toLocaleLowerCase(S.lang).includes(query));
  if (visibleSessions.length === 0) {
    box.appendChild(h('p', { class: 'empty', text: t(query ? 'sessions.searchEmpty' : 'sessions.empty') }));
    return;
  }
  const dir = S.sort.dir === 'asc' ? 1 : -1;
  const sorted = visibleSessions.slice().sort((a, b) => {
    const x = sortValue(a, S.sort.key);
    const y = sortValue(b, S.sort.key);
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });

  const head = h('tr', {});
  SORT_COLUMNS.forEach((col) => {
    const active = S.sort.key === col.key;
    const th = h('th', { scope: 'col', class: col.small ? 'hide-sm' : false, 'aria-sort': active ? (S.sort.dir === 'asc' ? 'ascending' : 'descending') : false });
    th.appendChild(h('button', {
      type: 'button',
      'aria-label': t('sessions.sortBy', { column: t(col.label) }),
      text: t(col.label),
      onclick: () => {
        if (S.sort.key === col.key) S.sort.dir = S.sort.dir === 'asc' ? 'desc' : 'asc';
        else S.sort = { key: col.key, dir: col.key === 'project' ? 'asc' : 'desc' };
        renderSessions(S.view);
      }
    }));
    head.appendChild(th);
  });

  const body = h('tbody', {});
  const displayed = query ? sorted : sorted.slice(0, S.sessionLimit);
  displayed.forEach((item) => {
    const s = item.s;
    const open = () => openSessionPage(s.id);
    body.appendChild(h('tr', { onclick: open },
      h('td', {},
        h('button', { type: 'button', class: 'row-open', 'aria-label': s.projectName + '. ' + t('sessions.open'), onclick: (e) => { e.stopPropagation(); open(); }, text: s.projectName }),
        s.live ? null : h('span', { class: 'badge', title: t('sessions.savedHint'), text: t('sessions.saved') })),
      h('td', { class: 'session-title', text: s.title ? (s.title.length > 60 ? s.title.slice(0, 59) + '…' : s.title) : '—', title: s.title || '' }),
      h('td', { text: Number.isFinite(s.start) ? F.date.format(s.start) : '—' }),
      h('td', { class: 'hide-sm' },
        h('span', { text: sessionDurationValue(s) }),
        h('span', { class: 'duration-secondary', text: hasActiveDuration(s) && hasSessionSpan(s)
          ? t('sessions.span', { duration: fmtSpan(s.durationMs) })
          : (hasActiveDuration(s) ? '' : t('sessions.legacyDuration')) })),
      h('td', { class: 'hide-sm', text: fmtInt(s.turns) }),
      h('td', { text: fmtCompact(s.maxContext), title: fmtInt(s.maxContext) }),
      h('td', { class: 'hide-sm', text: fmtCompact(item.raw), title: fmtInt(item.raw) }),
      h('td', { text: fmtCompact(item.weighted), title: fmtInt(item.weighted) }),
      h('td', { text: fmtInt(item.issues) })));
  });

  box.appendChild(h('div', { class: 'tablewrap' },
    h('table', { class: 'sessions-table' },
      h('caption', { class: 'sr', text: t('sessions.title') }),
      h('thead', {}, head),
      body)));
  if (!query && sorted.length > S.sessionLimit) {
    box.appendChild(h('button', { type: 'button', class: 'btn more', text: t('sessions.showMore'), onclick: () => { S.sessionLimit += 15; renderSessions(S.view); } }));
  }
}

/* =====================================================================
   Diagnostics
   ===================================================================== */
function diagParams(d) {
  const params = Object.assign({}, d.params);
  if (Object.prototype.hasOwnProperty.call(params, 'tool') && !params.tool) params.tool = t('tool.unknown');
  return params;
}

function sessionLabel(id) {
  const s = S.data.sessions.find((x) => x.id === id);
  return s ? s.projectName : '';
}

function diagCard(d, withSessionLink) {
  const params = diagParams(d);
  const metaParts = [];
  if (withSessionLink) metaParts.push(sessionLabel(d.sessionId));
  metaParts.push(F.dateTime.format(d.ts));
  if (withSessionLink) metaParts.push(t('diag.metaSession', { id: d.sessionId.slice(0, 8) }));
  if (d.code === 'huge_tool_result') metaParts.push(t('diag.metaTool', { tool: params.tool }));

  const card = h('li', { class: 'dcard d-' + d.code },

      h('span', { class: 'dimpact', title: fmtInt(d.impactTokens), text: t('diag.impactValue', { tokens: fmtCompact(d.impactTokens) }) })),
    h('p', { class: 'dmeta', text: metaParts.join(' · ') }),
    h('p', { class: 'detail', text: t('diag.' + d.code + '.detail', params) }));

  if (Array.isArray(d.params.preview) && d.params.preview.length) {
    card.appendChild(h('pre', { class: 'preview', text: d.params.preview.join('\n') }));

    card.appendChild(h('button', { type: 'button', class: 'btn', text: t('diag.openSession'), onclick: () => openSessionPage(d.sessionId) }));

}

function renderDiagnostics(v) {

/** The three problems that repeat the most in the selected period (informational notes excluded). */
function topMistakes(diags) {
  const groups = new Map();
  diags.forEach((d) => {
    if (d.severity === 'info') return;
    if (!groups.has(d.code)) groups.set(d.code, { code: d.code, count: 0, sessions: new Set(), tokens: 0, tools: new Map() });
    const g = groups.get(d.code);
    g.count += 1;
    g.sessions.add(d.sessionId);
    g.tokens += d.impactTokens;
    if (d.code === 'huge_tool_result') {
      const tool = d.params.tool || t('tool.unknown');
      g.tools.set(tool, (g.tools.get(tool) || 0) + 1);
    }
  });
  return Array.from(groups.values()).sort((a, b) => b.count - a.count || b.tokens - a.tokens).slice(0, 3);
}

function renderMistakes(selector, v) {
  const box = $(selector);
  clear(box);
  const top = topMistakes(v.diags);
  if (top.length === 0) {
    box.appendChild(h('p', { class: 'empty', text: t('mistakes.empty') }));
    return;
  }
  const grid = h('div', { class: 'mgrid' });
  top.forEach((g, i) => {
    const card = h('div', { class: 'mcard d-' + g.code },
      h('span', { class: 'rank', text: '#' + (i + 1) }),
      h('h3', { text: t('diag.' + g.code + '.title') }),
      h('p', { class: 'summary', text: t('mistakes.summary', { count: g.count, sessions: g.sessions.size, tokens: fmtCompact(g.tokens) }) }),
      h('p', { text: t('pattern.' + g.code) }));
    if (g.tools.size) {
      const best = Array.from(g.tools.entries()).sort((a, b) => b[1] - a[1])[0];
      card.appendChild(h('p', { text: t('mistakes.commonTool', { tool: best[0], count: best[1] }) }));
    }
    card.appendChild(h('div', { class: 'tipbox' }, h('b', { text: t('mistakes.whatToDo') + ': ' }), t('tips.' + g.code)));
    grid.appendChild(card);
  });
  box.appendChild(grid);
}

/* =====================================================================
   Session page
   ===================================================================== */
const markerPlugin = {
  id: 'sessionMarkers',
  afterDatasetsDraw(chart, args, options) {
    const ctx = chart.ctx;
    const area = chart.chartArea;
    const x = chart.scales.x;
    const y = chart.scales.y;
    (options.markers || []).forEach((m) => {
      const px = x.getPixelForValue(m.i + 1);
      if (px < area.left - 1 || px > area.right + 1) return;
      ctx.save();
      if (m.kind === 'spike') {
        const py = y.getPixelForValue(m.value);
        ctx.fillStyle = options.colors.spike;
        ctx.beginPath();
        ctx.moveTo(px, py - 9);
        ctx.lineTo(px - 6, py + 2);
        ctx.lineTo(px + 6, py + 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.strokeStyle = options.colors[m.kind];
        ctx.lineWidth = 1.6;
        ctx.setLineDash(m.kind === 'autoCompact' ? [6, 4] : m.kind === 'pause' ? [2, 4] : []);
        ctx.beginPath();
        ctx.moveTo(px, area.top);
        ctx.lineTo(px, area.bottom);
        ctx.stroke();
      }
      ctx.restore();
    });
  }
};

const baselineAreaPlugin = {
  id: 'baselineArea',
  beforeDatasetsDraw(chart, args, options) {
    const area = chart.chartArea;
    if (!area || !Number.isFinite(options.value)) return;
    const y = chart.scales.y;
    const top = Math.max(area.top, Math.min(area.bottom, y.getPixelForValue(options.value)));
    chart.ctx.save();
    chart.ctx.fillStyle = options.color;
    chart.ctx.fillRect(area.left, top, area.right - area.left, area.bottom - top);
    chart.ctx.restore();
  }
};

function drawSessionChart(session, canvas) {
  const series = session.series;
  const xs = series.x || series.ctx.map((_, i) => i + 1);
  const points = series.ctx.map((c, i) => ({ x: xs[i], y: c, out: series.out[i], ts: series.t[i] }));
  const limit = S.data.meta.thresholds.longSession.contextTokens;
  const color = cssVar('--accent');
  const datasets = [{
    label: t('session.chart.axisY'),
    data: points,
    borderColor: color,
    borderWidth: 2,
    fill: Number.isFinite(session.firstContext)
      ? { target: { value: session.firstContext }, above: color + '22', below: cssVar('--c-cacheRead') + '35' }
      : false,
    tension: 0.12,
    pointRadius: points.length > 120 ? 0 : 2.5,
    pointHoverRadius: 5
  }];
  if (Number.isFinite(session.firstContext)) {
    datasets.push({
      label: t('session.chart.baseline'),
      data: [{ x: 1, y: session.firstContext }, { x: Math.max(series.n, 2), y: session.firstContext }],
      borderColor: cssVar('--c-cacheRead'),
      borderWidth: 1.5,
      borderDash: [4, 4],
      pointRadius: 0,
      fill: false
    });
  }
  datasets.push({
    label: t('session.chart.limit'),
    data: [{ x: 1, y: limit }, { x: Math.max(series.n, 2), y: limit }],
    borderColor: cssVar('--d-long_session'),
    borderDash: [6, 5],
    borderWidth: 1.5,
    pointRadius: 0,
    fill: false
  });
  chartDefaults();
  S.charts.session = new window.Chart(canvas, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: { type: 'linear', min: 1, max: Math.max(series.n, 2), title: { display: true, text: t('session.chart.axisX') }, ticks: { precision: 0 } },
        y: { beginAtZero: true, title: { display: true, text: t('session.chart.axisY') }, ticks: { callback: (value) => fmtCompact(value) } }
      },
      plugins: {
        legend: { display: false },
        baselineArea: {
          value: session.firstContext,
          color: cssVar('--c-cacheRead') + '22'
        },
        sessionMarkers: {
          markers: session.markers,
          colors: {
            clear: cssVar('--d-long_session'),
            compact: cssVar('--accent'),
            autoCompact: cssVar('--accent'),
            pause: cssVar('--muted'),
            spike: cssVar('--c-cacheWrite')
          }
        },
        tooltip: {
          filter: (item) => item.datasetIndex === 0,
          callbacks: {
            title: (items) => (items.length ? t('session.chart.turn', { n: items[0].raw.x }) : ''),
            label: (item) => t('session.chart.context', { value: item.raw.y }),
            afterLabel: (item) => [t('session.chart.output', { value: item.raw.out }), F.dateTime.format(item.raw.ts)]
          }
        }
      }
    },
    plugins: [baselineAreaPlugin, markerPlugin]
  });
}

/* =====================================================================
   Export
   ===================================================================== */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = h('a', { href: url, download: name });
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function periodOf(v) {
  const keys = Array.from(v.days.keys()).sort();
  return { from: keys[0] || '', to: keys[keys.length - 1] || '' };
}

/** Summary without prompts, code, previews or project names. */
function buildExport(v) {
  const period = periodOf(v);
  return {
    app: 'tokenscope',
    version: S.data.meta.version,
    generatedAt: new Date().toISOString(),
    exampleData: Boolean(S.data.meta.example),
    period: period,
    weights: S.data.meta.weights,
    totals: {
      input: v.totals.i,
      output: v.totals.o,
      cacheWrite: v.totals.cw,
      cacheRead: v.totals.cr,
      weighted: Math.round(v.weighted),
      sessions: v.sessions.length,
      turns: v.totals.n,
      subagentTokens: v.totals.s
    },
    models: Array.from(v.models.entries()).map((e) => ({ model: e[0], input: e[1].i, output: e[1].o, cacheWrite: e[1].cw, cacheRead: e[1].cr })),
    daily: Array.from(v.days.keys()).sort().map((d) => {
      const a = v.days.get(d);
      return { date: d, input: a.i, output: a.o, cacheWrite: a.cw, cacheRead: a.cr };
    }),
    sessions: v.sessions.map((item) => ({
      id: item.s.id,
      task: item.s.title,
      project: item.s.projectName,
      turns: item.s.turns,
      activeDurationMs: item.s.activeDurationMs,
      durationMs: item.s.durationMs,
      tokens: item.raw
    })),
    sessionBaselineContext: median(v.sessions.map((item) => item.s.firstContext)),
    dataQuality: S.data.meta.lineQuality,
    diagnostics: v.diags.map((d) => {
      const params = Object.assign({}, d.params);
      delete params.preview;
      return { code: d.code, severity: d.severity, date: localDay(d.ts), impactTokens: d.impactTokens, params: params };
    }),
    mostFrequentMistakes: topMistakes(v.diags).map((g) => ({ code: g.code, times: g.count, sessions: g.sessions.size, impactTokens: g.tokens }))
  };
}

function exportJson() {
  const blob = new Blob([JSON.stringify(buildExport(S.view), null, 2)], { type: 'application/json' });
  downloadBlob(blob, 'claude-token-summary-' + localDay(Date.now()) + '.json');
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(/\s+/);
  let line = '';
  words.forEach((word) => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y);
      line = word;
      y += lineHeight;
    } else {
      line = test;
    }
  });
  if (line) { ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}

function exportImage() {
  const v = S.view;
  const W = 1200;
  const M = 56;
  const scale = 2;
  const tall = document.createElement('canvas');
  tall.width = W * scale;
  tall.height = 2400 * scale;
  const ctx = tall.getContext('2d');
  ctx.scale(scale, scale);

  const sans = cssVar('--sans');
  const ink = cssVar('--ink');
  const muted = cssVar('--muted');
  const rule = cssVar('--rule');
  ctx.fillStyle = cssVar('--bg');
  ctx.fillRect(0, 0, W, 2400);
  ctx.textBaseline = 'alphabetic';

  const period = periodOf(v);
  const weighted = S.filters.measure === 'weighted';
  const values = {};
  TYPES.forEach((type) => { values[type] = typeValue(type, v.totals); });
  const sum = TYPES.reduce((a, type) => a + values[type], 0) || 1;
  let y = M + 18;

  ctx.fillStyle = muted;
  ctx.font = '400 20px ' + sans;
  ctx.fillText(t('export.image.title'), M, y);
  y += 30;
  ctx.fillText(t('export.image.period', { from: period.from ? F.date.format(parseDay(period.from)) : '', to: period.to ? F.date.format(parseDay(period.to)) : '' }), M, y);

  y += 96;
  ctx.fillStyle = ink;
  ctx.font = '700 84px ' + sans;
  ctx.fillText(fmtCompact(weighted ? v.weighted : v.raw), M, y);
  ctx.fillStyle = muted;
  ctx.font = '400 20px ' + sans;
  ctx.fillText(t(weighted ? 'overview.weighted' : 'overview.total'), M, y + 32);
  y += 78;

  let bx = M;
  const barW = W - M * 2;
  TYPES.forEach((type) => {
    const w = Math.max(values[type] > 0 ? 3 : 0, (values[type] / sum) * barW);
    ctx.fillStyle = cssVar('--c-' + type);
    ctx.fillRect(bx, y, Math.max(0, w - 3), 30);
    bx += w;
  });
  y += 72;
  TYPES.forEach((type, i) => {
    const colX = M + i * (barW / 4);
    ctx.fillStyle = cssVar('--c-' + type);
    ctx.fillRect(colX, y - 12, 12, 12);
    ctx.fillStyle = muted;
    ctx.font = '400 17px ' + sans;
    ctx.fillText(t('tokenType.' + type), colX + 20, y);
    ctx.fillStyle = ink;
    ctx.font = '700 26px ' + sans;
    ctx.fillText(fmtCompact(values[type]), colX, y + 34);
    ctx.fillStyle = muted;
    ctx.font = '400 15px ' + sans;
    ctx.fillText(fmtPct(values[type] / sum), colX, y + 58);
  });
  y += 112;

  const models = Array.from(v.models.entries())
    .map((e) => ({ model: e[0], value: aggValue(e[1]) }))
    .sort((a, b) => b.value - a.value).slice(0, 4);
  ctx.strokeStyle = rule;
  ctx.beginPath(); ctx.moveTo(M, y - 30); ctx.lineTo(W - M, y - 30); ctx.stroke();
  ctx.fillStyle = ink;
  ctx.font = '700 24px ' + sans;
  ctx.fillText(t('models.title'), M, y);
  y += 36;
  ctx.font = '400 18px ' + sans;
  models.forEach((m) => {
    ctx.fillStyle = ink;
    ctx.textAlign = 'left';
    ctx.fillText(m.model === 'unknown' ? t('model.unknown') : m.model, M, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = muted;
    ctx.fillText(fmtCompact(m.value) + '  ' + fmtPct(m.value / sum), W - M, y);
    ctx.textAlign = 'left';
    y += 30;
  });
  y += 30;

  const top = v.diags.slice(0, 5);
  if (top.length) {
    ctx.strokeStyle = rule;
    ctx.beginPath(); ctx.moveTo(M, y - 30); ctx.lineTo(W - M, y - 30); ctx.stroke();
    ctx.fillStyle = ink;
    ctx.font = '700 24px ' + sans;
    ctx.fillText(t('diag.title'), M, y);
    y += 36;
    ctx.font = '400 18px ' + sans;
    top.forEach((d) => {
      ctx.fillStyle = ink;
      ctx.textAlign = 'left';
      ctx.fillText(t('diag.' + d.code + '.title'), M, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = muted;
      ctx.fillText(t('diag.impactValue', { tokens: fmtCompact(d.impactTokens) }), W - M, y);
      ctx.textAlign = 'left';
      y += 30;
    });
    y += 30;
  }

  const mistakes = topMistakes(v.diags);
  if (mistakes.length) {
    ctx.strokeStyle = rule;
    ctx.beginPath(); ctx.moveTo(M, y - 30); ctx.lineTo(W - M, y - 30); ctx.stroke();
    ctx.fillStyle = ink;
    ctx.font = '700 24px ' + sans;
    ctx.fillText(t('mistakes.title'), M, y);
    y += 36;
    mistakes.forEach((g) => {
      ctx.fillStyle = ink;
      ctx.font = '700 18px ' + sans;
      ctx.fillText(t('diag.' + g.code + '.title') + '  (' + fmtInt(g.count) + ')', M, y);
      y += 26;
      ctx.fillStyle = muted;
      ctx.font = '400 16px ' + sans;
      y = wrapText(ctx, t('tips.' + g.code), M, y, W - M * 2, 23) + 12;
    });
  }

  y += 24;
  ctx.fillStyle = muted;
  ctx.font = '400 15px ' + sans;
  ctx.fillText(t('export.image.footer'), M, y);
  y += M;

  const out = document.createElement('canvas');
  out.width = W * scale;
  out.height = Math.ceil(y * scale);
  out.getContext('2d').drawImage(tall, 0, 0);
  out.toBlob((blob) => { if (blob) downloadBlob(blob, 'claude-token-summary-' + localDay(Date.now()) + '.png'); }, 'image/png');
}

/* =====================================================================
   Top-level render and events
   ===================================================================== */
function showMessageOnly(text) {
  $('#loading').hidden = true;
  $('#toolbar').hidden = true;
  $('#tabs').hidden = true;
  $('#content').hidden = true;
  $('#emptyState').hidden = false;
  $('#emptyState h2').hidden = true;
  $('#emptyBody').textContent = text;
  $('#emptyHint').hidden = true;
}

function renderLangSeg() {
  const seg = $('#langSeg');
  clear(seg);
  SUPPORTED.forEach((code) => {
    seg.appendChild(h('button', { type: 'button', 'data-value': code, 'aria-pressed': String(S.lang === code), text: t('lang.' + code), lang: code, onclick: () => setLang(code) }));
  });
}

function renderActive() {
  destroyAllCharts();
  const detail = S.openSession !== null;
  $('#viewOverview').hidden = detail || S.tab !== 'overview';
  $('#viewSessions').hidden = detail || S.tab !== 'sessions';
  $('#viewDiagnostics').hidden = detail || S.tab !== 'diagnostics';
  $('#viewSession').hidden = !detail;
  $('#toolbar').hidden = detail;
  $('#measureHint').hidden = detail || S.filters.measure !== 'weighted';
  document.querySelectorAll('#tabs .tab').forEach((tab) => {
    tab.setAttribute('aria-selected', String(!detail && tab.dataset.tab === S.tab));
  });

  if (detail) {
    if (renderSessionPage()) return;
    $('#viewSession').hidden = true;
    $('#toolbar').hidden = false;
    $('#viewOverview').hidden = S.tab !== 'overview';
    $('#viewSessions').hidden = S.tab !== 'sessions';
    $('#viewDiagnostics').hidden = S.tab !== 'diagnostics';
  }

  renderToolbar();
  S.view = computeView();
  if (S.tab === 'overview') {
    renderKpis(S.view);
    renderDaily(S.view);
    renderModels(S.view);
    renderTrend(S.view);
    renderMistakes('#mistakesOverview', S.view);
  } else if (S.tab === 'sessions') {
    renderSessions(S.view);
  } else {
    renderDiagnostics(S.view);
    renderMistakes('#mistakesDiag', S.view);
  }
}

function renderAll() {
  applyI18n();
  applyTheme();
  renderLangSeg();
  if (!S.data) return;
  renderNotices();
  $('#loading').hidden = true;

  if (S.data.meta.empty) {
    const reason = S.data.meta.emptyReason;
    const key = reason === 'missingDir' ? 'empty.missingDir' : reason === 'noFiles' ? 'empty.noFiles' : 'empty.noTurns';
    $('#toolbar').hidden = true;
    $('#tabs').hidden = true;
    $('#content').hidden = true;
    $('#emptyState').hidden = false;
    $('#emptyState h2').hidden = false;
    $('#emptyBody').textContent = t(key, { dir: S.data.meta.dataDir });
    $('#emptyHint').hidden = false;
    return;
  }

  $('#emptyState').hidden = true;
  $('#tabs').hidden = false;
  $('#content').hidden = false;
  renderActive();
}

function setLang(code) {
  if (SUPPORTED.indexOf(code) === -1) return;
  S.lang = code;
  storeSet('lang', code);
  setFormatters();
  renderAll();
}

function cycleTheme() {
  S.themeMode = THEME_MODES[(THEME_MODES.indexOf(S.themeMode) + 1) % THEME_MODES.length];
  storeSet('theme', S.themeMode);
  renderAll();
}

async function refresh() {
  try {
    await loadData();
    renderAll();
  } catch (err) {
    showMessageOnly(t(err && err.code === 'noToken' ? 'warn.noToken' : 'err.load'));
  }
}

function wireEvents() {
  $('#themeBtn').addEventListener('click', cycleTheme);
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (S.themeMode === 'auto') renderAll(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }
  document.querySelectorAll('#tabs .tab').forEach((tab) => {
    tab.addEventListener('click', () => { S.tab = tab.dataset.tab; S.openSession = null; renderAll(); window.scrollTo(0, 0); });
  });
  $('#backBtn').addEventListener('click', () => { S.openSession = null; renderAll(); });
  $('#fromDate').addEventListener('change', (e) => { S.filters.from = e.target.value; S.preset = 'custom'; renderAll(); });
  $('#toDate').addEventListener('change', (e) => { S.filters.to = e.target.value; S.preset = 'custom'; renderAll(); });
  $('#projectSel').addEventListener('change', (e) => { S.filters.project = e.target.value; S.sessionLimit = 15; renderAll(); });
  $('#sessionSearch').addEventListener('input', (e) => { S.sessionSearch = e.target.value; S.sessionLimit = 15; renderSessions(S.view); });
  $('#refreshBtn').addEventListener('click', refresh);
  $('#exportJson').addEventListener('click', () => { exportJson(); $('#exportMenu').open = false; });
  $('#exportImage').addEventListener('click', () => { exportImage(); $('#exportMenu').open = false; });
}

async function init() {
  S.lang = initialLang();
  const storedTheme = storeGet('theme');
  S.themeMode = THEME_MODES.indexOf(storedTheme) !== -1 ? storedTheme : 'auto';
  S.token = readToken();
  setFormatters();
  wireEvents();
  try {
    await loadTranslations();
  } catch (e) {
    // Without translations the keys themselves are shown.
  }
  setFormatters();
  renderLangSeg();
  applyI18n();
  applyTheme();
  await refresh();
}

init();
})();
</script>
